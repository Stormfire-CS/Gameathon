<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Add Game</title>
</head>
<body>
<div th:replace="~{fragments :: topBar}"></div>
<h1>Gameathon</h1>
<p>Please enter game information: <span th:text="${user.name}"></span></p>
<a th:href="@{/ownerPage}">
    <button type="button">My Stuff</button>
</a>
<a th:href="@{/viewGamesPage}">
    <button type="button">View My Games</button>
</a>
<a th:href="@{/addGamePage}">
    <button type="button">Don't See desired Game?</button>
</a>
<form th:action="@{/addGameToCollection}" method="post">
    <label>Game Name:</label>
    <select name="gameID">
        <option value="">Select a Game</option>

        <option th:each="game : ${games}" th:value="${game.gameID}" th:text="${game.gameName}">
        </option>
    </select>

    <label>Year Produced:</label>
    <input type="number" name="yearProduced" placeholder="Year Produced (optional)"/>

    <button type="submit">Add Game to Collection</button>

</form>
<hr>

<h2>Your Games</h2>

<table>
    <tr>
        <th>Game Name</th>
        <th>Minimum Players |</th>
        <th>Maximum Players |</th>
        <th>Year Produced |</th>
        <th>Action</th>
    </tr>

    <tr th:each="gameOwned : ${ownedGames}">
        <td th:text="${gameOwned.game.gameName}"></td>
        <td th:text="${gameOwned.game.minPlayers}"></td>
        <td th:text="${gameOwned.game.maxPlayers}"></td>
        <td th:text="${gameOwned.yearProduced}"></td>

        <td>
            <form th:action="@{/deleteGameFromCollection}" method="post">
                <input type="hidden"
                       name="gameOwnedID"
                       th:value="${gameOwned.gameOwnedID}"/>

                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
