<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Change Password</title>
    </head>
    <body>
        <div th:replace="~{fragments :: topBar}"></div>
        <h1>Changing Password</h1>
        <p>
            Enter you new password twice <span th:text="${user.name}"></span> and click change, to change your password.
        </p>

        <form th:action="@{/changePassword}" th:object="${editPasswordForm}" method="post">
            <label for="password1"> Enter your new Password: </label>
            <input type="password" id="password1" th:field="*{password1}" placeholder="Password"/>
            <span th:if="${#fields.hasErrors('password1')}"
                  th:text="${#strings.listJoin(#fields.errors('password1'), '; ')}">Password1 errors</span><br/>
            <label for="password2">Re-enter your new Password: </label>
            <input type="password" id="password2" th:field="*{password2}" placeholder="Reenter Password"/>
            <span th:if="${#fields.hasErrors('password2')}"
                  th:text="${#strings.listJoin(#fields.errors('password2'), '; ')}">Password2 errors</span><br/>
            <span th:if="${#fields.hasErrors('passwordMatching')}" th:errors="*{passwordMatching}">Password matching error</span><br/>
            <button type="submit">Change</button>
        </form>
    </body>
</html>
