<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>View Games</title>
</head>
<body>
    <h1>Gameathon</h1>
    <p>Welcome to viewing your games: <span th:text="${username}"></span> </p>
    <a th:href="@{/ownerPage(username=${username})}">
        <button type="button">Back to Home</button>
    </a>
    <a th:href="@{/addGamePage(username=${username})}">
        <button type="button">Add Game</button>
    </a>

    <h2>Games</h2>
    <table>
        <tr>
            <th>Game Name</th>
            <th>Minimum Players</th>
            <th>Maximum Players</th>
        </tr>
        <tr th:each="game : ${games}">
            <td th:text="${game.gameName}"></td>
            <td th:text="${game.minPlayers}"></td>
            <td th:text="${game.maxPlayers}"></td>
        </tr>
    </table>
</body>
</html>
