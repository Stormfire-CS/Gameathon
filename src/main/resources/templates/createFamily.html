<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Family</title>
</head>
<body>
<h1>Create a Family</h1>
<p>
    Creating a family <span th:text="${user.name}"></span>
</p>
<a th:href="@{/familyPage}">
    <button type="button">Back to Family</button>
</a>

<form th:action="@{/createFamily}" method="post">
    <label for="familyName">Family Name:</label>
    <input type="text" id="familyName" name="familyName" placeholder="Family Name"/>
    <button type="submit">Create Family</button>
</form>
</body>
</html>
