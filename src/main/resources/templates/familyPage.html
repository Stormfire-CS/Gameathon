<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Family Home</title>
</head>
<body>
<div th:replace="~{fragments :: topBar}"></div>
<h1>Gameathon Family</h1>
<p>
    Welcome to your family page: <span th:text="${user.name}"></span>
</p>
<a th:href="@{/homePage}">
    <button type="button">My Home</button>
</a>

<a th:href="@{/ownerPage}">
    <button type="button">My Stuff</button>
</a>


<div th:if="${!isFamilyMember}">
    <h2>You are not currently part of a family.</h2>
    <p>You can join an existing family or create your own.</p>
    <a th:href="@{/joinFamilyPage}">
        <button type="button">Join a Family</button>
    </a>
    <a th:href="@{/createFamilyPage}">
        <button type="button">Create a Family</button>
    </a>
</div>

<div th:if="${isFamilyMember}">
    <h2>Your Family</h2>
    <p>
        Family Name:
        <span th:text="${family.familyName}"></span>
    </p>
    <p>
        Family ID:
        <span th:text="${family.familyID}"></span>
    </p>
    <p>
        Family Administrator:
        <span th:text="${family.familyAdmin.name}"></span>
    </p>
    <div th:if="${isFamilyAdmin}">
        <a th:href="@{/editFamilyPage}">
            <button type="button">Review Family Requests</button>
        </a>
    </div>
</div>
</body>
</html>
