<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Enter Password Page</title>
    </head>
    <body>
        <h1>You must enter your password to verify identity before changing your password</h1>
        <a th:href="@{/editAccount}"><button type="button">Back to Changing Name</button></a><br>
        <form th:action="@{/enterPasswordPage}" th:object="${loginForm}" method="post">
            <input type="hidden" th:field="*{username}"/>
            <label for="password">Current Password:</label><input type="password" id="password" th:field="*{password}"/>
            <span th:if="${#fields.hasErrors('password')}" th:text="${#strings.listJoin(#fields.errors('password'), '; ')}">Password Error</span><br>
            <button type="submit">Verify Password</button>
        </form>
    </body>
</html>
