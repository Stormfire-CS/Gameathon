<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Owner Home</title>
    </head>
    <body>
        <div th:replace="~{fragments :: topBar}"></div>
        <h1>Gameathon</h1>
        <h4>Welcome to your stuff: <span th:text="${user.name}"></span></h4>
        If you wish to perform a family acction click on My family, if you wish to view your collection click on View My Games, <br>
        if you wish to edit your collection click on Edit My Collection.<br><br>
        <a th:href="@{/homePage}"><button type="button">My Home</button></a>
        <a th:href="@{/familyPage}"><button type="button">My Family</button></a>
        <a th:href="@{/viewGamesPage}"><button type="button">View My Games</button></a>
        <a th:href="@{/editCollectionPage}"><button type="button">Edit My Collection</button></a>
    </body>
</html>
